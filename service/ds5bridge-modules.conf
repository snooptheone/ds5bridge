# ds5bridge needs vhci_hcd, the kernel's virtual USB host controller. Loading it at boot is also what lets the udev rules decide safely: they hide the real
# Bluetooth pad only while this module is there (see 72-ds5bridge-hide.rules).
vhci_hcd
