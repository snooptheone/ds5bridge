# WirePlumber 0.5 and later. Makes the DualSense's USB audio function (the virtual pad ds5bridge serves) show up the way Proton/Wine need it:
#  - the card uses the plain "analog-surround-40" profile and not the UCM one (UCM splits the pad into a hidden four-channel parent and a one-channel speaker sink),
#  - its sink is called "Wireless Controller" (the name Wine's DualSense endpoint code looks for), takes 4 channels of S16LE at 48 kHz, and passes them through
#    unmixed (channels 1-2 are the pad speaker, 3-4 the haptic actuators), with a high priority so that the sink stays awake for the stream.
# WirePlumber reads its configuration once at start: after installing this file run `systemctl --user restart wireplumber` (or log out and in).
# The same rules for WirePlumber 0.4 (Ubuntu 24.04) are in 90-dualsense.lua; keep the two in step (tests/test_wireplumber.sh checks the property names).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Sony_Interactive_Entertainment_DualSense.*"
      }
    ]
    actions = {
      update-props = {
        "api.alsa.use-ucm" = false,
        "device.profile-set" = "analog-surround-40.conf"
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Sony_Interactive_Entertainment_DualSense.*.analog-surround-40"
      }
    ]
    actions = {
      update-props = {
        "node.description" = "Wireless Controller",
        "node.nick" = "Wireless Controller",
        "audio.format" = "S16LE",
        "audio.rate" = 48000,
        "node.force-rate" = 48000,
        "channelmix.disable" = true,
        "priority.driver" = 1500,
        "priority.session" = 1500
      }
    }
  }
]
