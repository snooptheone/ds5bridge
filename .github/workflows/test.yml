name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - name: "Build and test (no hardware, no root; a pty plays the pad and vhci_hcd is faked)"
        run: make test
      - name: Same tests under AddressSanitizer and UBSan
        run: make asan
